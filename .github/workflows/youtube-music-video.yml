name: AI YouTube Music Video Generator

on:
  schedule:
    - cron: '*/30 * * * *' # 30분마다 실행
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '다운로드할 유튜브 영상 URL (예: https://www.youtube.com/watch?v=...)'
        required: false
        default: ''
        type: string
      custom_title:
        description: '업로드할 유튜브 영상 제목 (비워두면 원곡 정보로 자동 생성)'
        required: false
        default: ''
        type: string

jobs:
  create-and-upload:
    runs-on: ubuntu-latest # 다시 GitHub 서버 환경으로 복구
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U "requests==2.31.0" "pydub==0.25.1" "numpy==1.26.4" "google-api-python-client==2.118.0" "google-auth-oauthlib==1.2.0" "google-auth-httplib2==0.2.0" yt-dlp

      - name: Generate Music Video
        env:
          INPUT_YOUTUBE_URL: ${{ inputs.youtube_url }}
          INPUT_CUSTOM_TITLE: ${{ inputs.custom_title }}
        run: |
          python scripts/generate_music_video.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: "잠잘 때나 공부할 때 듣기 좋은 편안한 피아노 연주곡 (Sleep & Study Piano)"
          VIDEO_DESCRIPTION: "made by keyin."
        run: |
          python scripts/upload_to_youtube.py output_music_video.mp4
