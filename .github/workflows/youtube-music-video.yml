name: AI YouTube Music Video Generator

on:
  schedule:
    - cron: '*/30 * * * *' # 30분마다 실행
  workflow_dispatch: # 수동 즉시 실행 가능 (100% 자동 랜덤 생성)

jobs:
  create-and-upload:
    runs-on: ubuntu-latest # 다시 GitHub 서버 환경으로 복구
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "moviepy<2.0.0" pydub numpy scipy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Generate Music Video
        run: |
          python scripts/generate_music_video.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: "잠잘 때나 공부할 때 듣기 좋은 편안한 피아노 연주곡 (Sleep & Study Piano)"
          VIDEO_DESCRIPTION: "made by keyin."
        run: |
          python scripts/upload_to_youtube.py output_music_video.mp4
