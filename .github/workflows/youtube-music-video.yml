name: AI YouTube Music Video Generator

on:
  schedule:
    - cron: '*/30 * * * *' # 30분마다 자동 실행
  workflow_dispatch: # 수동 즉시 실행 가능
    inputs:
      genre:
        description: 'AI 음악 장르 선택'
        required: true
        default: 'piano'
        type: choice
        options:
          - 'piano'
          - 'lofi'
          - 'jazz'
          - 'citypop'
          - 'ambient'
          - 'edm'
          - 'jpop'
      custom_prompt:
        description: '커스텀 AI 작곡 프롬프트 (비워두면 장르별 추천 프롬프트로 자동 작곡)'
        required: false
        default: ''
        type: string
      custom_title:
        description: '업로드할 유튜브 영상 제목 (비워두면 AI 곡명으로 자동 생성)'
        required: false
        default: ''
        type: string

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests==2.31.0" "pydub==0.25.1" "numpy==1.26.4" "scipy==1.13.0" "Pillow==10.3.0" "google-api-python-client==2.118.0" "google-auth-oauthlib==1.2.0" "google-auth-httplib2==0.2.0"

      - name: Generate AI Music Video
        env:
          INPUT_GENRE: ${{ inputs.genre }}
          INPUT_CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
          INPUT_CUSTOM_TITLE: ${{ inputs.custom_title }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/generate_music_video.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_to_youtube.py output_music_video.mp4
